<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي الأول</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Tajawal', Arial, sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #b2ebf2, #80deea);
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 28px;
      padding: 50px 40px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,150,200,0.25);
      border: 2px solid #b2ebf2;
      text-align: center;
    }
    .avatar {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #0088cc, #00c6ff);
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5em;
    }
    h1 { font-size: 2em; font-weight: 900; margin-bottom: 12px; color: #0077b6; }
    .subtitle { font-size: 1em; color: #888; margin-bottom: 18px; }
    p { font-size: 1.1em; line-height: 1.9; color: #555; margin-bottom: 28px; }
    .divider {
      width: 60px; height: 3px;
      background: linear-gradient(90deg, #0088cc, #00c6ff);
      border-radius: 10px;
      margin: 0 auto 28px;
    }
    .social-title { font-size: 0.9em; color: #aaa; margin-bottom: 16px; }
    .socials {
      display: flex; flex-wrap: wrap;
      gap: 12px; justify-content: center;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 24px; border-radius: 50px;
      text-decoration: none; font-size: 0.95em;
      font-family: 'Tajawal', sans-serif; font-weight: 700;
    }
    .btn-telegram { background: linear-gradient(135deg, #0088cc, #00b4ff); color: white; }
    .btn-instagram { background: linear-gradient(135deg, #f09433, #dc2743, #bc1888); color: white; }
    .btn-tiktok { background: #111; color: white; }
    .btn-github { background: #24292e; color: white; }
    .btn-main {
      background: linear-gradient(135deg, #0088cc, #0077b6);
      color: white; padding: 14px 36px;
      font-size: 1.05em; width: 100%;
      justify-content: center; border-radius: 16px;
      display: flex;
    }
    .footer { margin-top: 24px; font-size: 0.8em; color: #bbb; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">👋</div>
    <h1>مرحباً بكم!</h1>
    <div class="subtitle">مرحباً في موقعي الشخصي</div>
    <p>هذا موقعي الأول على الإنترنت.<br>تم بناؤه بـ HTML و CSS.</p>
    <div class="divider"></div>
    <div class="social-title">تواصل معي</div>
    <div class="socials">
      <a class="btn btn-telegram" href="https://t.me/mohamedmkisse" target="_blank">📱 Telegram</a>
      <a class="btn btn-instagram" href="#" target="_blank">📸 Instagram</a>
      <a class="btn btn-tiktok" href="#" target="_blank">🎵 TikTok</a>
      <a class="btn btn-github" href="https://github.com/mkisse00-art" target="_blank">💻 GitHub</a>
    </div>
    <a class="btn btn-main" href="https://t.me/mohamedmkisse" target="_blank">📱 تواصل معي على Telegram</a>
    <div class="footer">© 2026 — موقعي الأول</div>
  </div>
</body>
</html>
