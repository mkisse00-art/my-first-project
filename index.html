      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .bubble {
      position: fixed;
      border-radius: 50%;
      background: rgba(0, 150, 200, 0.08);
      animation: float linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes float {
      0% { transform: translateY(110vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
