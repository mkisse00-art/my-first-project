<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي الأول</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #b2ebf2, #80deea);
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      box-shadow: 0 10px 40px rgba(0,150,200,0.2);
      border: 2px solid #b2ebf2;
    }
    h1 { font-size: 2em; margin-bottom: 10px; color: #0077b6; }
    p { font-size: 1.1em; line-height: 1.8; color: #555; margin-bottom: 20px; }
    .btn {
      display: inline-block;
      margin: 10px auto;
      padding: 12px 30px;
      background: #0088cc;
      color: white;
      border-radius: 30px;
      text-decoration: none;
      font-size: 1em;
    }
    .btn:hover { background: #0077b6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>مرحباً بكم! 👋</h1>
    <p>هذا موقعي الأول على الإنترنت.<br>تم بناؤه بـ HTML و CSS.</p>
    <a class="btn" href="https://t.me/mohamedmkisse" target="_blank">
      📱 تواصل معي على Telegram
    </a>
  </div>
</body>
</html>
