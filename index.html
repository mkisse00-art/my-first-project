<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoAr — منصة الاستثمار</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    :root {
      --gold:#f0b429;--gold2:#ffd166;
      --dark:#0a0e1a;--dark2:#111827;--card:#151e30;
      --border:rgba(240,180,41,0.15);
      --green:#00c896;--red:#ff4d6d;--blue:#0088cc;
      --text:#e2e8f0;--muted:#8899aa;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Tajawal',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;}
    .page{display:none;min-height:100vh;}
    .page.active{display:flex;}

    /* LOGIN */
    #loginPage{align-items:center;justify-content:center;padding:20px;
      background:radial-gradient(ellipse at 60% 0%,rgba(240,180,41,0.12) 0%,transparent 60%),
      radial-gradient(ellipse at 0% 100%,rgba(0,200,150,0.08) 0%,transparent 50%),var(--dark);}
    .login-box{background:var(--card);border:1px solid var(--border);border-radius:24px;
      padding:48px 40px;width:100%;max-width:420px;box-shadow:0 30px 80px rgba(0,0,0,0.5);
      animation:fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) both;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
    .logo{text-align:center;margin-bottom:36px;}
    .logo-icon{width:64px;height:64px;background:linear-gradient(135deg,var(--gold),var(--gold2));
      border-radius:18px;display:inline-flex;align-items:center;justify-content:center;
      font-size:2em;margin-bottom:12px;box-shadow:0 8px 30px rgba(240,180,41,0.4);}
    .logo h1{font-size:1.8em;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--gold2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .logo p{color:var(--muted);font-size:0.9em;margin-top:4px;}
    .tabs{display:flex;background:var(--dark2);border-radius:12px;padding:4px;margin-bottom:28px;}
    .tab{flex:1;padding:10px;border:none;border-radius:10px;background:transparent;color:var(--muted);
      font-family:'Tajawal',sans-serif;font-size:0.95em;font-weight:700;cursor:pointer;transition:all 0.2s;}
    .tab.active{background:var(--gold);color:var(--dark);}
    .form-group{margin-bottom:18px;}
    .form-group label{display:block;font-size:0.85em;color:var(--muted);margin-bottom:8px;font-weight:500;}
    .form-group input{width:100%;background:var(--dark2);border:1px solid var(--border);border-radius:12px;
      padding:14px 16px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:1em;outline:none;
      transition:border 0.2s;direction:ltr;text-align:right;}
    .form-group input:focus{border-color:var(--gold);}
    .btn-primary{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--dark);
      border:none;border-radius:14px;padding:16px;font-family:'Tajawal',sans-serif;font-size:1.05em;
      font-weight:900;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;
      box-shadow:0 6px 25px rgba(240,180,41,0.35);margin-top:8px;}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 35px rgba(240,180,41,0.45);}
    .msg{border-radius:10px;padding:12px;font-size:0.9em;text-align:center;margin-bottom:16px;display:none;}
    .err{background:rgba(255,77,109,0.1);border:1px solid rgba(255,77,109,0.3);color:var(--red);}
    .suc{background:rgba(0,200,150,0.1);border:1px solid rgba(0,200,150,0.3);color:var(--green);}

    /* NAVBAR */
    .navbar{background:var(--card);border-bottom:1px solid var(--border);padding:16px 20px;
      display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .nav-logo{font-size:1.3em;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--gold2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .nav-right{display:flex;align-items:center;gap:10px;}
    .nav-avatar{width:38px;height:38px;background:linear-gradient(135deg,var(--gold),var(--gold2));
      border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--dark);}
    .btn-logout{background:rgba(255,77,109,0.1);border:1px solid rgba(255,77,109,0.3);color:var(--red);
      border-radius:10px;padding:8px 14px;font-family:'Tajawal',sans-serif;font-size:0.85em;font-weight:700;cursor:pointer;}
    .btn-sm{border-radius:10px;padding:8px 14px;font-family:'Tajawal',sans-serif;font-size:0.85em;font-weight:700;cursor:pointer;border:none;}
    .btn-gold{background:rgba(240,180,41,0.1);border:1px solid var(--border);color:var(--gold);}
    .btn-blue{background:rgba(0,136,204,0.1);border:1px solid rgba(0,136,204,0.3);color:var(--blue);}

    /* DASH */
    #dashPage{flex-direction:column;}
    .dash-content{padding:20px;max-width:860px;margin:0 auto;width:100%;}

    /* Tabs nav */
    .dash-tabs{display:flex;background:var(--dark2);border-radius:14px;padding:4px;margin-bottom:24px;gap:4px;}
    .dash-tab{flex:1;padding:10px 6px;border:none;border-radius:10px;background:transparent;color:var(--muted);
      font-family:'Tajawal',sans-serif;font-size:0.85em;font-weight:700;cursor:pointer;transition:all 0.2s;text-align:center;}
    .dash-tab.active{background:var(--card);color:var(--gold);border:1px solid var(--border);}

    .tab-panel{display:none;}
    .tab-panel.active{display:block;}

    .welcome-banner{background:linear-gradient(135deg,rgba(240,180,41,0.12),rgba(0,200,150,0.06));
      border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:20px;}
    .welcome-banner h2{font-size:1.4em;font-weight:900;margin-bottom:4px;}
    .welcome-banner p{color:var(--muted);font-size:0.95em;}

    /* Portfolio */
    .portfolio-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:20px;}
    .portfolio-card h3{color:var(--muted);font-size:0.9em;margin-bottom:8px;}
    .portfolio-value{font-size:2.5em;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--gold2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .portfolio-change{color:var(--green);font-size:0.95em;margin-top:6px;}
    .port-actions{display:flex;gap:10px;margin-top:16px;}
    .btn-dep{flex:1;background:linear-gradient(135deg,var(--green),#00a87a);color:white;border:none;
      border-radius:12px;padding:12px;font-family:'Tajawal',sans-serif;font-size:0.95em;font-weight:700;cursor:pointer;}
    .btn-with{flex:1;background:rgba(255,77,109,0.1);border:1px solid rgba(255,77,109,0.3);color:var(--red);
      border-radius:12px;padding:12px;font-family:'Tajawal',sans-serif;font-size:0.95em;font-weight:700;cursor:pointer;}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:32px;width:100%;max-width:380px;animation:fadeUp 0.4s ease both;}
    .modal h3{font-size:1.2em;font-weight:900;margin-bottom:20px;}
    .modal input{width:100%;background:var(--dark2);border:1px solid var(--border);border-radius:12px;
      padding:14px 16px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:1em;outline:none;
      direction:ltr;text-align:right;margin-bottom:16px;}
    .modal input:focus{border-color:var(--gold);}
    .modal-btns{display:flex;gap:10px;}
    .btn-cancel{flex:1;background:var(--dark2);border:1px solid var(--border);color:var(--muted);
      border-radius:12px;padding:12px;font-family:'Tajawal',sans-serif;font-size:0.95em;font-weight:700;cursor:pointer;}
    .btn-confirm-dep{flex:1;background:linear-gradient(135deg,var(--green),#00a87a);color:white;border:none;
      border-radius:12px;padding:12px;font-family:'Tajawal',sans-serif;font-size:0.95em;font-weight:700;cursor:pointer;}
    .btn-confirm-with{flex:1;background:linear-gradient(135deg,var(--red),#cc2244);color:white;border:none;
      border-radius:12px;padding:12px;font-family:'Tajawal',sans-serif;font-size:0.95em;font-weight:700;cursor:pointer;}

    /* Transactions */
    .tx-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
    .tx-item{background:var(--dark2);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
    .tx-left{display:flex;align-items:center;gap:12px;}
    .tx-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1em;}
    .tx-dep-icon{background:rgba(0,200,150,0.15);color:var(--green);}
    .tx-with-icon{background:rgba(255,77,109,0.15);color:var(--red);}
    .tx-name{font-weight:700;font-size:0.95em;}
    .tx-date{color:var(--muted);font-size:0.8em;}
    .tx-amount-dep{color:var(--green);font-weight:700;}
    .tx-amount-with{color:var(--red);font-weight:700;}

    /* Crypto prices */
< truncated lines 130-744 >
      labels,
      datasets:[{
        data,borderColor:color,backgroundColor:color+'22',
        borderWidth:2.5,fill:true,tension:0.4,pointRadius:4,
        pointBackgroundColor:color,pointBorderColor:color
      }]
    },
    options:{
      responsive:true,plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#8899aa',font:{family:'Tajawal'}},grid:{color:'rgba(255,255,255,0.04)'}},
        y:{ticks:{color:'#8899aa',font:{family:'Tajawal'},callback:v=>'$'+v.toLocaleString()},grid:{color:'rgba(255,255,255,0.04)'}}
      }
    }
  });
}

// ===== ADMIN =====
function renderAdminStats(){
  const count=users.length;
  const total=users.reduce((s,u)=>s+(u.wallet||10000),0);
  const avg=count?total/count:0;
  document.getElementById('statUsers').textContent=count;
  document.getElementById('statTotal').textContent='$'+Math.round(total).toLocaleString('en-US');
  document.getElementById('statAvg').textContent='$'+Math.round(avg).toLocaleString('en-US');
}
function renderUsersTable(){
  const wrap=document.getElementById('usersTableWrap');
  if(!users.length){wrap.innerHTML='<div class="empty-state">لا يوجد مستخدمين بعد 📭</div>';return;}
  wrap.innerHTML=`<table class="users-table"><thead><tr>
    <th>الاسم</th><th>البريد</th><th>المحفظة ($)</th><th colspan="4"></th>
  </tr></thead><tbody>${users.map((u,i)=>`
    <tr>
      <td><div class="user-name-cell"><div class="u-avatar">${u.name.charAt(0)}</div><span>${u.name}</span></div></td>
      <td style="direction:ltr;text-align:right;color:var(--muted);font-size:0.82em">${u.email}</td>
      <td><input class="wallet-input" type="number" value="${u.wallet||10000}" id="wallet_${i}"></td>
      <td><button class="btn-save" onclick="saveWallet(${i})">💾</button></td>
      <td><button class="btn-msg" onclick="openMsgModal(${i})">✉️</button></td>
      <td><button class="btn-detail" onclick="showUserDetail(${i})">👁</button></td>
      <td><button class="btn-del" onclick="deleteUser(${i})">🗑</button></td>
    </tr>`).join('')}</tbody></table>`;
}
function saveWallet(i){
  const val=parseFloat(document.getElementById('wallet_'+i).value)||0;
  users[i].wallet=val;save();
  renderAdminStats();showToast('✅ تم تحديث المحفظة');
}
function deleteUser(i){
  if(!confirm('هل أنت متأكد؟'))return;
  users.splice(i,1);save();
  renderAdminStats();renderUsersTable();showToast('🗑 تم حذف المستخدم');
}
function adminAddUser(){
  const name=document.getElementById('addName').value.trim();
  const email=document.getElementById('addEmail').value.trim();
  const pass=document.getElementById('addPass').value;
  const wallet=parseFloat(document.getElementById('addWallet').value)||10000;
  if(!name||!email||!pass)return showToast('⚠️ يرجى ملء جميع الحقول','err');
  if(users.find(u=>u.email===email))return showToast('⚠️ البريد مستخدم','err');
  users.push({name,email,pass,wallet,txs:[],alerts:[],msgs:[]});
  save();renderAdminStats();renderUsersTable();
  document.getElementById('addName').value='';
  document.getElementById('addEmail').value='';
  document.getElementById('addPass').value='';
  document.getElementById('addWallet').value='10000';
  showToast('✅ تم إضافة المستخدم');
}
function showUserDetail(i){
  const u=users[i];
  const txs=u.txs||[];
  const totalDep=txs.filter(t=>t.type==='dep').reduce((s,t)=>s+t.amount,0);
  const totalWith=txs.filter(t=>t.type==='with').reduce((s,t)=>s+t.amount,0);
  document.getElementById('detailContent').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div class="detail-header" style="margin:0">
        <div class="detail-avatar">${u.name.charAt(0)}</div>
        <div><div class="detail-name">${u.name}</div><div class="detail-email">${u.email}</div></div>
      </div>
      <button onclick="closeModal('detailModal')" style="background:none;border:none;color:var(--muted);font-size:1.5em;cursor:pointer">×</button>
    </div>
    <div class="detail-stats">
      <div class="detail-stat"><div class="detail-stat-val">$${(u.wallet||0).toLocaleString()}</div><div class="detail-stat-label">المحفظة الحالية</div></div>
      <div class="detail-stat"><div class="detail-stat-val">${txs.length}</div><div class="detail-stat-label">المعاملات</div></div>
      <div class="detail-stat"><div class="detail-stat-val" style="color:var(--green)">+$${totalDep.toLocaleString()}</div><div class="detail-stat-label">إجمالي الإيداع</div></div>
      <div class="detail-stat"><div class="detail-stat-val" style="color:var(--red)">-$${totalWith.toLocaleString()}</div><div class="detail-stat-label">إجمالي السحب</div></div>
    </div>
    <div class="detail-tx"><h4>آخر المعاملات</h4>
      ${txs.length?txs.slice(0,5).map(t=>`
        <div class="tx-item" style="margin-bottom:8px">
          <div class="tx-left"><div class="tx-icon ${t.type==='dep'?'tx-dep-icon':'tx-with-icon'}">${t.type==='dep'?'⬆️':'⬇️'}</div>
          <div><div class="tx-name">${t.type==='dep'?'إيداع':'سحب'}</div><div class="tx-date">${t.date}</div></div></div>
          <div class="${t.type==='dep'?'tx-amount-dep':'tx-amount-with'}">${t.type==='dep'?'+':'-'}$${t.amount.toLocaleString()}</div>
        </div>`).join(''):'<div style="color:var(--muted);font-size:0.9em">لا توجد معاملات</div>'}
    </div>
    <div style="margin-top:16px">
      <h4 style="color:var(--muted);font-size:0.9em;margin-bottom:10px">الرسائل المرسلة (${(u.msgs||[]).length})</h4>
      ${(u.msgs||[]).length?[...(u.msgs||[])].reverse().slice(0,3).map(m=>`
        <div class="msg-item" style="margin-bottom:8px"><div class="msg-header"><span class="msg-from">✉️</span><span class="msg-time">${m.date}</span></div><div class="msg-body">${m.body}</div></div>`).join(''):'<div style="color:var(--muted);font-size:0.9em">لا توجد رسائل</div>'}
    </div>`;
  openModal('detailModal');
}
function openMsgModal(i){
  msgTargetIndex=i;
  document.getElementById('msgTarget').textContent=users[i].name;
  document.getElementById('msgBody').value='';
  openModal('msgModal');
}
function sendMsg(){
  const body=document.getElementById('msgBody').value.trim();
  if(!body)return showToast('⚠️ اكتب رسالة أولاً','err');
  if(!users[msgTargetIndex].msgs)users[msgTargetIndex].msgs=[];
  users[msgTargetIndex].msgs.push({body,date:new Date().toLocaleString('ar-MA'),read:false});
  save();closeModal('msgModal');
  showToast('✅ تم إرسال الرسالة');
}

function showToast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=type==='err'?'var(--red)':'var(--green)';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));
</script>
</body>
  </html>
