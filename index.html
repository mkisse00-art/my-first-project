<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي الأول</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
    }

    h1 {
      font-size: 2em;
      margin-bottom: 10px;
      color: #e94560;
    }

    p {
      font-size: 1.1em;
      line-height: 1.8;
      color: #ccc;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 30px;
      background: #e94560;
      color: white;
      border-radius: 30px;
      text-decoration: none;
      font-size: 1em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>مرحباً بكم! 👋</h1>
    <p>هذا موقعي الأول على الإنترنت.<br>تم بناؤه بـ HTML و CSS.</p>
    <a class="btn" href="#">تواصل معي</a>
  </div>
</body>
</html>
